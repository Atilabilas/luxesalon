<!doctype html>
<html lang="tr">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Celil & Atilla — Stitch tasarım incelemesi</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9e6e1;color:#1a1a1a;font:14px system-ui,sans-serif}header{background:#faf9f7;border-bottom:1px solid #ccc5ba;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:18px}strong{display:block;font-size:16px}small{display:block;margin-top:4px;color:#635d55}nav{display:flex;gap:8px;align-items:center}button,a{font:inherit}button{min-height:44px;padding:9px 18px;background:transparent;border:1px solid #bbb3a5;cursor:pointer}button[aria-pressed="true"]{background:#1a1a1a;color:white;border-color:#1a1a1a}nav a{color:#554b3b;margin-left:12px}main{display:flex;justify-content:center;padding:16px;height:calc(100vh - 80px)}iframe{background:#faf9f7;border:1px solid #c7beb1;width:100%;max-width:1440px;height:100%;transition:width .2s}iframe.mobile{width:390px;flex:none}@media(max-width:700px){header{align-items:flex-start;flex-direction:column;padding:10px 16px}main{height:calc(100vh - 130px);padding:10px}iframe.mobile{max-width:100%}nav a{font-size:12px}}
</style>
<header><div><strong>Celil & Atilla · Sade ana sayfa taslağı</strong><small>Yalnız görsel inceleme · Üretim sitesine uygulanmadı</small></div><nav><button id="home">Ana sayfaya dön</button><button id="desktop" aria-pressed="true">Masaüstü</button><button id="mobile" aria-pressed="false">Mobil · 390px</button></nav></header>
<main><iframe id="preview" src="desktop.html" title="Stitch masaüstü tasarımının mevcut fotoğraflarla inceleme kopyası"></iframe></main>
<script>const frame=document.getElementById('preview');let current='desktop';function showHome(name){current=name;frame.src=name+'.html';frame.className=name==='mobile'?'mobile':'';frame.title=name==='mobile'?'Sade mobil ana sayfa':'Sade masaüstü ana sayfa';for(const other of ['desktop','mobile'])document.getElementById(other).setAttribute('aria-pressed',String(name===other));}for(const name of ['desktop','mobile'])document.getElementById(name).addEventListener('click',()=>showHome(name));document.getElementById('home').addEventListener('click',()=>showHome(current));</script>
</html>
